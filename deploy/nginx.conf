# Ask Knowledge —— 生产反向代理（Nginx）
# 关键点：SSE 必须关闭缓冲，否则流式问答会「攒完再吐」。
# 挂载：/etc/nginx/conf.d/default.conf；静态产物放 /usr/share/nginx/html（frontend/npm run build 的 dist/）

upstream ask_knowledge_api {
    server 127.0.0.1:8000;   # 容器内改为 backend:8000
    keepalive 32;
}

# ask ai 阶段五后端（FastAPI）：提供 /api/knowledge/* 知识库文档管理
upstream ask_ai_api {
    server 127.0.0.1:8080;   # 容器内改为 ask-ai:8080
    keepalive 8;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;          # 与 MAX_UPLOAD_SIZE_MB(15) 留出余量

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;

    # 前端 SPA：history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（文件名带 hash）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SSE 流式问答：单独 location，务必关闭缓冲与缓存
    location ~ ^/api/v1/kbs/[^/]+/chat/stream$ {
        proxy_pass http://ask_knowledge_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        proxy_buffering off;           # ★ 流式必须
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        add_header X-Accel-Buffering no always;
    }

    # 知识库文档管理 → ask ai 阶段五后端（Dify Dataset 代理；前缀更长，优先命中）
    location /api/knowledge/ {
        proxy_pass http://ask_ai_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        proxy_read_timeout 300s;   # 上传 15MB 文档 + Dify 归档可能较慢
        proxy_send_timeout 300s;
    }

    # 其余 API
    location /api/ {
        proxy_pass http://ask_knowledge_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    # 健康检查（不写访问日志）
    location = /health {
        proxy_pass http://ask_knowledge_api;
        access_log off;
    }
}
