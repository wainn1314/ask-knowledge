    - data:
        code: "import json\nimport re\n\n\ndef main(llm_output: str) -> dict:\n  \
          \  text = (llm_output or \"\").strip()\n\n    # 1) 剥掉推理模型（deepseek 等）的思考段\n\
          \    text = re.sub(r\"<think[\\s\\S]*?</think\\s*>\", \"\", text, flags=re.IGNORECASE)\n\
          \    text = re.sub(r\"<!--\\s*dify-deepseek-reasoning\\s*-->\", \"\", text)\n\
          \    text = re.sub(r\"<think[\\s\\S]*$\", \"\", text, flags=re.IGNORECASE)\
          \  # 未闭合的思考段\n\n    # 2) 剥掉 markdown 代码块围栏\n    text = text.strip()\n  \
          \  if text.startswith(\"```\"):\n        text = re.sub(r\"^```[A-Za-z]*\\\
          s*\", \"\", text)\n        text = re.sub(r\"```\\s*$\", \"\", text)\n\n\
          \    # 3) 只截取最外层 JSON 对象\n    start, end = text.find(\"{\"), text.rfind(\"\
          }\")\n    if start != -1 and end > start:\n        text = text[start:end\
          \ + 1]\n\n    # 4) 解析 + 结构校验\n    try:\n        data = json.loads(text)\n\
          \    except json.JSONDecodeError as e:\n        return {\"success\": \"\
          False\", \"error\": f\"JSON 解析失败: {str(e)}\", \"raw_output\": text, \"questions\"\
          : \"[]\"}\n\n    if \"questions\" not in data:\n        return {\"success\"\
          : \"False\", \"error\": \"缺少 questions 字段\", \"raw_output\": text, \"questions\"\
          : \"[]\"}\n\n    questions = data[\"questions\"]\n    if not isinstance(questions,\
          \ list) or not questions:\n        return {\"success\": \"False\", \"error\"\
          : \"questions 为空或格式不正确\", \"raw_output\": text, \"questions\": \"[]\"}\n\
          \n    for i, q in enumerate(questions):\n        for field in (\"\
          question\", \"answer\", \"explanation\"):\n            if field not in q:\n\
          \                return {\"success\": \"False\", \"error\": f\"第 {i+1} 题缺少字段:\
          \ {field}\", \"raw_output\": text, \"questions\": \"[]\"}\n        q.setdefault(\"id\", i + 1)\n        q.setdefault(\"\
          type\", \"简答题\")\n        q.setdefault(\"options\", [])\n\n    return {\"\
          success\": \"True\", \"error\": \"\", \"raw_output\": text,\n          \
          \  \"questions\": json.dumps(questions, ensure_ascii=False, indent=2)}\n"
        code_language: python3
