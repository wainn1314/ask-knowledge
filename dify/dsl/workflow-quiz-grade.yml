      height: 200
      id: grade_start
      position:
        x: 80
        y: 320
      positionAbsolute:
        x: 80
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            temperature: 0.1
          mode: chat
          name: deepseek-v4-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: 3f9c1f5a-7c2b-4a5e-9d31-8b6f0c2a1d47
          role: system
          text: |
            你是严谨的阅卷老师，负责给简答题打分。

            评分材料：
            - 题目：{{#grade_start.stem#}}
            - 参考答案：{{#grade_start.reference_answer#}}
            - 采分点：{{#grade_start.grading_points#}}
            - 学员作答：{{#grade_start.user_answer#}}

            评分要求：
            1. 满分 100 分，按采分点逐项给分；如果采分点为空，请先按参考答案归纳 3-5 个要点再评分。
            2. 语义等价即可算命中，不要求用词完全一致；表述更完整、举例正确可适当加分。
            3. 空答、答非所问或与参考答案矛盾的表述给 0-20 分；只命中一小部分要点给 20-59 分；要点基本齐全给 60-85 分；完整准确给 86-100 分。
            4. 60 分为及格线：完全不理解题意的作答不要给及格分，但对表述粗糙却抓住要点的作答要从宽。
            5. comment 用中文写 1-3 句，说明得分理由和最主要的一处改进建议。

            只输出如下 JSON，不要输出任何额外文本或 markdown 代码块：
            {"score": 85, "hit_points": ["命中的要点"], "miss_points": ["遗漏的要点"], "comment": "评语"}
        selected: false
        title: 判分
        type: llm
        vision:
          enabled: false
      height: 87
      id: grade_llm
      position:
        x: 400
        y: 320
      positionAbsolute:
        x: 400
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        code: |
          import json
          import re


          def main(llm_output: str) -> dict:
              text = (llm_output or "").strip()

              # 1) 剥掉推理模型（deepseek 等）的思考段与 markdown 围栏
              text = re.sub(r"<think[\s\S]*?</think\s*>", "", text, flags=re.IGNORECASE)
              text = re.sub(r"<!--\s*dify-deepseek-reasoning\s*-->", "", text)
              text = re.sub(r"<think[\s\S]*$", "", text, flags=re.IGNORECASE)
              text = text.strip()
              if text.startswith("```"):
                  text = re.sub(r"^```[A-Za-z]*\s*", "", text)
                  text = re.sub(r"```\s*$", "", text)
              text = text.strip()
              start, end = text.find("{"), text.rfind("}")
              if start != -1 and end > start:
                  text = text[start:end + 1]

              # 2) 解析
              try:
                  data = json.loads(text)
              except json.JSONDecodeError as e:
                  return {"score": 0.0, "hit_points": "", "miss_points": "",
                          "comment": "判分输出解析失败：{}".format(e)}
              if not isinstance(data, dict):
                  return {"score": 0.0, "hit_points": "", "miss_points": "",
                          "comment": "判分输出不是 JSON 对象"}

              # 3) 归一化：score 夹到 0-100，命中/遗漏要点统一用「；」拼成字符串
              def join_points(key: str) -> str:
                  value = data.get(key)
                  if isinstance(value, list):
                      items = [str(item).strip() for item in value]
                  elif isinstance(value, str):
                      items = [item.strip() for item in re.split(r"[;；\n]", value)]
                  else:
                      items = []
                  return "；".join(item for item in items if item)

              try:
                  score = float(data.get("score", 0))
              except (TypeError, ValueError):
                  score = 0.0
              score = max(0.0, min(100.0, round(score, 2)))

              return {
                  "score": score,
                  "hit_points": join_points("hit_points"),
                  "miss_points": join_points("miss_points"),
                  "comment": str(data.get("comment") or "").strip(),
              }
        code_language: python3
        outputs:
          comment:
            children: null
            type: string
          hit_points:
            children: null
            type: string
          miss_points:
            children: null
            type: string
          score:
            children: null
            type: number
        selected: false
        title: 解析判分结果
        type: code
        variables:
        - value_selector:
          - grade_llm
          - text
          value_type: string
          variable: llm_output
      height: 51
      id: grade_code
      position:
        x: 720
        y: 320
      positionAbsolute:
        x: 720
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        outputs:
        - value_selector:
          - grade_code
          - score
          value_type: number
          variable: score
        - value_selector:
          - grade_code
          - hit_points
          value_type: string
          variable: hit_points
        - value_selector:
          - grade_code
          - miss_points
          value_type: string
          variable: miss_points
        - value_selector:
          - grade_code
          - comment
          value_type: string
          variable: comment
        selected: false
        title: 输出
        type: end
      height: 178
      id: grade_end
      position:
        x: 1040
        y: 320
      positionAbsolute:
        x: 1040
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    viewport:
      x: -60.0
      y: 120.0
      zoom: 0.7
  rag_pipeline_variables: []
